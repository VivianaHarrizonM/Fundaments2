<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scriptlets con JSPs</title>

    <!-- ✅ Agregar Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

  </head>
  <body class="bg-light">
    <div class="container mt-5">
      <h1 class="text-center mb-4 text-dark">Scriptlets con JSPs</h1>

      <div class="text-center mb-3">
        <a href="scriptlets.jsp" class="btn btn-outline-info">Ejemplos de Scriptles</a>
      </div>

      <div class="card shadow-sm mx-auto" style="max-width: 400px;">
        <div class="card-body">

          <form name="form1" action="fondoColor.jsp">
            <div class="mb-3"> 
              proporciona el color de fondo (ejemplo: red, blue, yellow, while, etc)
              <input
                type="text"
                class="form-control"
                id="text"
                name="colorFondo"
                placeholder="Ingresa un color"
                required
              />
            </div>

            <div class="text-center">
              <button type="submit" class="btn btn-info w-100">Enviar</button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
