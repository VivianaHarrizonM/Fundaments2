<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ejemplo Expresiones JSPs</title>

    <!-- ✅ Agregar Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

  </head>
  <body class="bg-light">
    <div class="container mt-5">
      <h1 class="text-center mb-4 text-primary">Ejemplo Expresiones JSPs</h1>

      <div class="text-center mb-3">
        <a href="expresiones.jsp" class="btn btn-outline-info">Ir al JSP de Expresiones</a>
      </div>

      <div class="card shadow-sm mx-auto" style="max-width: 400px;">
        <div class="card-body">
          <h4 class="card-title text-center mb-3">Formulario HTML</h4>

          <form name="form1" action="procesaFormulario.jsp" method="POST">
            <div class="mb-3">
              <label for="usuario" class="form-label" >Usuario</label>
              <input
                type="text"
                class="form-control"
                id="usuario"
                name="usuario"
                placeholder="Ingresa tu usuario"
                required
              />
            </div>

            <div class="mb-3">
              <label for="password" class="form-label">Contraseña</label>
              <input
                type="password"
                class="form-control"
                id="password"
                name="password"
                placeholder="Ingresa tu contraseña"
                required
              />
            </div>

            <div class="text-center">
              <button type="submit" class="btn btn-info w-100">Enviar</button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
